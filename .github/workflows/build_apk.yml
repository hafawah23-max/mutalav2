
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Mutala Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create Android platform
        run: |
          flutter create \
            --platforms=android \
            --project-name mutala \
            --org com.mutala .

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Java Kotlin compatibility
        run: |
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              plugins.withId("org.jetbrains.kotlin.android") {
                  tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                      val javaTaskName = name.replace(
                          "Kotlin",
                          "JavaWithJavac"
                      )

                      val javaCompileTask = tasks.findByName(
                          javaTaskName
                      ) as? org.gradle.api.tasks.compile.JavaCompile

                      if (javaCompileTask != null) {
                          compilerOptions.jvmTarget.set(
                              org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(
                                  javaCompileTask.targetCompatibility
                              )
                          )
                      }
                  }
              }
          }
          EOF

      - name: Enable Core Library Desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          if "isCoreLibraryDesugaringEnabled" not in text:
              text = text.replace(
                  "compileOptions {",
                  "compileOptions {\n"
                  "        isCoreLibraryDesugaringEnabled = true",
                  1
              )

          dependency = (
              'coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.4"'
              ')'
          )

          if "desugar_jdk_libs" not in text:
              text += (
                  "\n\ndependencies {\n"
                  f"    {dependency}\n"
                  "}\n"
              )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify Android configuration
        run: |
          grep -n "isCoreLibraryDesugaringEnabled" \
            android/app/build.gradle.kts
          grep -n "desugar_jdk_libs" \
            android/app/build.gradle.kts

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mutala-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
