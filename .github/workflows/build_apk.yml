
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Mutala Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create Android platform
        run: |
          flutter create \
            --platforms=android \
            --project-name mutala \
            --org com.mutala .

      - name: Install dependencies
        run: flutter pub get

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36"

      - name: Fix Java Kotlin compatibility
        run: |
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              plugins.withId("org.jetbrains.kotlin.android") {
                  tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                      val javaTaskName = name.replace(
                          "Kotlin",
                          "JavaWithJavac"
                      )

                      val javaCompileTask = tasks.findByName(
                          javaTaskName
                      ) as? org.gradle.api.tasks.compile.JavaCompile

                      if (javaCompileTask != null) {
                          compilerOptions.jvmTarget.set(
                              org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(
                                  javaCompileTask.targetCompatibility
                              )
                          )
                      }
                  }
              }
          }
          EOF

      - name: Enable Core Library Desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          if "isCoreLibraryDesugaringEnabled" not in text:
              text = text.replace(
                  "compileOptions {",
                  "compileOptions {\n"
                  "        isCoreLibraryDesugaringEnabled = true",
                  1
              )

          dependency = (
              'coreLibraryDesugaring('
              '"com.android.tools:desugar_jdk_libs:2.1.4"'
              ')'
          )

          if "desugar_jdk_libs" not in text:
              text += (
                  "\n\ndependencies {\n"
                  f"    {dependency}\n"
                  "}\n"
              )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Fix Android SDK 36 compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Update application compileSdk
          app = Path("android/app/build.gradle.kts")
          text = app.read_text(encoding="utf-8")

          text = re.sub(
              r"compileSdk\s*=\s*[^\n]+",
              "compileSdk = 36",
              text,
              count=1
          )

          app.write_text(text, encoding="utf-8")
          print("Application compileSdk updated to 36")

          # Update file_picker plugin compileSdk
          cache = Path.home() / ".pub-cache"

          files = list(cache.glob(
              "hosted/pub.dev/file_picker-*/android/build.gradle"
          ))

          files += list(cache.glob(
              "hosted/pub.dev/file_picker-*/android/build.gradle.kts"
          ))

          for path in files:
              text = path.read_text(encoding="utf-8")

              text = re.sub(
                  r"compileSdkVersion\s+\d+",
                  "compileSdkVersion 36",
                  text
              )

              text = re.sub(
                  r"compileSdk\s+\d+",
                  "compileSdk 36",
                  text
              )

              text = re.sub(
                  r"compileSdk\s*=\s*\d+",
                  "compileSdk = 36",
                  text
              )

              path.write_text(text, encoding="utf-8")
              print("Updated plugin:", path)
          PY

      - name: Verify Android configuration
        run: |
          echo "Checking compileSdk:"
          grep -n "compileSdk" android/app/build.gradle.kts

          echo "Checking desugaring:"
          grep -n "isCoreLibraryDesugaringEnabled" \
            android/app/build.gradle.kts

          grep -n "desugar_jdk_libs" \
            android/app/build.gradle.kts

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mutala-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
