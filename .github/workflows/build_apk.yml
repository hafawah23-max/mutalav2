
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform
        run: |
          flutter create \
            --platforms=android \
            --project-name mutala \
            --org com.mutala .

      - name: Install dependencies
        run: flutter pub get

      - name: Fix JVM compatibility
        run: |
          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              plugins.withId("org.jetbrains.kotlin.android") {
                  tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                      val kotlinCompileTask = this
                      val javaTaskName = name.replace(
                          "Kotlin",
                          "JavaWithJavac"
                      )

                      val javaCompileTask = tasks.findByName(
                          javaTaskName
                      ) as? org.gradle.api.tasks.compile.JavaCompile

                      if (javaCompileTask != null) {
                          compilerOptions.jvmTarget.set(
                              org.jetbrains.kotlin.gradle.dsl.JvmTarget.fromTarget(
                                  javaCompileTask.targetCompatibility
                              )
                          )
                      }
                  }
              }
          }
          EOF

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mutala-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
